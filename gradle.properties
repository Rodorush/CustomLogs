org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 traz suporte a Kotlin embutido e registra a própria extensão `kotlin`, que colide com o
# plugin org.jetbrains.kotlin.android. O ChartPatternTracker desliga o embutido pelo mesmo motivo;
# manter os dois projetos no mesmo modo evita divergência de comportamento do compilador.
android.builtInKotlin=false

# O DSL novo do AGP 9 (padrão) é incompatível com esse mesmo plugin: ele espera BaseExtension e
# recebe LibraryExtensionImpl, e a aplicação falha com ClassCastException. Enquanto o Kotlin
# Gradle Plugin não migrar, o legado é obrigatório — o aviso de deprecação no build é o preço.
android.newDsl=false

# Dokka 2 em modo V2: o V1 está deprecado e sai na próxima major. Gera o javadoc jar que o
# Maven Central exige e que o javadoc.io publica.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
